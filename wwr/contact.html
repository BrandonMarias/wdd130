<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rafting River Fighter</title>
    <meta name="description"
      content="Contact Rafting River Fighter for trip questions, reservations, and our newsletter. Find our address, phone, email, and map.">
    <meta name="author" content="Brandon Andres Marias Doroteo">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.jpg" alt="White Water Rafting Logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company">
            <h1>Rafting River Fighter</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <div class="contact">
            <iframe src="https://www.google.com/maps?q=Kolob,California&output=embed" title="Map of our location" loading="lazy"></iframe>

            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="general" required> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="website"> Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <label><input type="checkbox" name="newsletter"> Please subscribe me to the monthly newsletter</label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="staff">
            <h2>We Are Here to Serve You</h2>
            <div class="staff-list">
                <figure>
                    <img src="images/happy-client.jpg" alt="Head river guide">
                    <figcaption>Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/happy-client.jpg" alt="Trip coordinator">
                    <figcaption>Trip Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/happy-client.jpg" alt="Safety instructor">
                    <figcaption>Safety Instructor</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | Rafting River Fighter | Brandon Andres Marias Doroteo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook-icon.svg" alt="Facebook Icon">
            </a>
            <a href="https://x.com" target="_blank" rel="noopener noreferrer">
                <img src="images/twitter-icon.svg" alt="X Icon">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram-icon.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
