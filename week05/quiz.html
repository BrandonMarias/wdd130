<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML and CSS Knowledge Quiz</title>
    <meta name="description"
      content="Test your knowledge of HTML and CSS fundamental concepts with this four-question online quiz.">
    <meta name="author" content="Web Development Student">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML and CSS Knowledge Quiz</h1>
    </header>

    <main>
        <form action="#" method="post" class="quiz-form">
            <div class="form-item">
                <label for="q1">1. What HTML tag is used to create a hyperlink? (Fill in the
                    blank)</label>
                <input type="text" id="q1" name="q1" placeholder="e.g., <a>" required>
            </div>

            <div class="form-item">
                <label for="q2">2. Explain the purpose of CSS in modern web design. (Short
                    answer)</label>
                <textarea id="q2" name="q2" rows="4" placeholder="Type your answer here..."
                  required></textarea>
            </div>

            <div class="form-item">
                <label for="q3">3. Which CSS selector selects an element by its ID
                    attribute?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="hash">Hash (#)</option>
                    <option value="dot">Dot (.)</option>
                    <option value="colon">Colon (:)</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">4. How many levels of section headings exist in HTML (h1 through
                    h6)?</label>
                <input type="number" id="q4" name="q4" min="1" max="10"
                  placeholder="Enter an integer" required>
            </div>

            <div class="form-item">
                <button type="submit" class="submit-btn">Submit Quiz</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Web Development Course. All rights reserved.</p>
    </footer>
</body>

</html>
